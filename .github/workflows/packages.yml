name: Rust packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: ./setup.sh
      - run: .venv/bin/python -m pip install -r requirements-build.txt
      - run: .venv/bin/python tests/test_beta.py -v
      - run: .venv/bin/python packaging/build-macos.py
      - run: QT_QPA_PLATFORM=offscreen 'dist/macos/Nothing X.app/Contents/MacOS/nothingx' --demo --screenshot /tmp/nothingx-macos.png
      - run: ditto -c -k --sequesterRsrc --keepParent 'dist/macos/Nothing X.app' "dist/NothingX-macos-$(uname -m).app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NothingX-macos-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.app.zip
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - run: python -m pip install --upgrade pip
      - run: python packaging/build-flatpak.py
      - uses: actions/upload-artifact@v4
        with:
          name: NothingX-flatpak
          path: dist/*.flatpak
