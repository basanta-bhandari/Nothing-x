[package]
name = "cosmic-applet-nothingx"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[features]
rust-backend = []

[dependencies]
serde_json = "1"
tokio = { version = "1.52", features = ["process", "io-util", "sync", "rt", "time", "macros"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]
