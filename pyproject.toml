[build-system]
requires = ["setuptools>=68", "Cython>=3.1,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "nothingx-linux"
version = "0.4.0"
description = "Nothing and CMF audio controls for Linux and macOS"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.6,<7", "PySide6-Addons>=6.6,<7", "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'"]
license = "MIT"

[project.scripts]
nothingx-linux = "nothingx.__main__:main"

[tool.setuptools.package-data]
nothingx = ["assets/cmf-buds-pro-2/*.png", "assets/cmf-buds-pro-2/*.json", "bin/nothingx-core", "bin/libnothingx_*", "assets/models.json", "assets/devices/*", "assets/themes/*.json", "assets/themes/references/*"]

[tool.setuptools.packages.find]
include = ["nothingx*"]
